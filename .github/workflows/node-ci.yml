name: Node.js Login App CI

# Triggers the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # Run the workflow on a fresh hosted Ubuntu virtual environment
    runs-on: ubuntu-latest

    strategy:
      # Matrix runs your testing pipeline concurrently across multiple versions
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    # 1. Fetches your codebase from the GitHub repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. provisions the Node runtime specified by the matrix block
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        #cache: 'npm' # Speeds up builds by caching node_modules

    # 3. Clean install of exact dependencies from package-lock.json
    - name: Install dependencies
      run: npm install

    # 4. Executes test script (runs 'jest' inside the package.json config)
    - name: Run Integration Tests
      run: npm test
